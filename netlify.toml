[build]
  publish = "."
  # Ping IndexNow (Bing/Copilot, Yandex, Seznam, Naver) with the sitemap URLs
  # on every deploy. Google does not support IndexNow and continues to use
  # sitemap.xml + Search Console. Trailing `|| true` guarantees a failed or
  # timed-out ping can never break a deploy.
  command = "bash scripts/indexnow.sh || true"

# Security headers + default caching for HTML / clean-URL pages.
# HTML must always revalidate so a new deploy is visible immediately
# (no more stale/half-styled pages stuck in the browser cache).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=0, must-revalidate"

# Static assets change rarely and can be cached longer for speed.
[[headers]]
  for = "/*.css"
  [headers.values]
    # Revalidate on each request. The browser still gets a cheap 304 when
    # nothing changed, but a deployed style change is visible immediately
    # instead of being masked by a 24h cache.
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
